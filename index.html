<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Bootstrap Form</title>
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card ">
                    <div class="card-header">
                        <h4> Payment form example </h4>
                    </div>
                    <div class="card-body">
                        <form class="row g-3 px-4 needs-validation" id="formularioPago" novalidate>
                            <!-- CC information -->
                            <div class="col-md-4 position-relative">
                                <label for="cc-number" class="form-label">Card #</label>
                                <input type="text" class="form-control" id="cc-number" placeholder="xxxxxxxxxxxxxxx"
                                    maxlength="16" required>
                                <div class="valid-tooltip">
                                    Looks good!
                                </div>
                            </div>
                            <div class="col-md-4 position-relative">
                                <label for="cvc-number" class="form-label">CVC #</label>
                                <input type="text" class="form-control" id="cvc-number" placeholder="xxx" maxlength="3"
                                    required>
                                <!--QUE HAGO CON EL VALUE?  POR QUE NO PUEDO PONER MAX?-->
                                <div class="valid-tooltip">
                                    Looks good!
                                </div>
                            </div>
                            <div class="col-md-4 position-relative">
                                <label for="validationTooltipUsername" class="form-label">Amount</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text" id="validationTooltipUsernamePrepend">$</span>
                                    <input type="text" class="form-control" id="validationTooltipUsername"
                                        aria-describedby="validationTooltipUsernamePrepend" required>
                                    <div class="invalid-tooltip">
                                        Please choose a unique and valid username.
                                    </div>
                                </div>
                            </div>

                            <!-- name lastName -->
                            <div class="col-md-6 position-relative">
                                <label for="name" class="form-label">First name</label>
                                <input type="text" class="form-control" id="name" placeholder="Name" required>
                                <div class="valid-feedback">
                                    Looks good!
                                </div>
                            </div>
                            <div class="col-md-6 position-relative">
                                <label for="validationCustom02" class="form-label">Last name</label>
                                <input type="text" class="form-control" id="validationCustom02" placeholder="Last Name"
                                    required>
                                <div class="valid-feedback">
                                    Looks good!
                                </div>
                            </div>

                            <!-- city state postal code -->
                            <div class="col-md-6">
                                <label for="validationCustom03" class="form-label">City</label>
                                <input type="text" class="form-control" id="validationCustom03" required>
                                <div class="invalid-feedback">
                                    Please provide a valid city.
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label for="validationCustom04" class="form-label">State</label>
                                <select class="form-select" id="validationCustom04" required>
                                    <option selected disabled value="">Choose...</option>
                                    <option>...</option>
                                </select>
                                <div class="invalid-feedback">
                                    Please select a valid state.
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label for="validationCustom05" class="form-label">Zip</label>
                                <input type="text" class="form-control" id="validationCustom05" required>
                                <div class="invalid-feedback">
                                    Please provide a valid zip.
                                </div>
                            </div>

                            <!-- payment info and comments -->
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">We accept</label>
                                    <div class="container rounded-2 text-white bg-secondary py-2 d-flex justify-content-between">
                                        <div class="col">
                                            <div class="form-check form-check-inline">
                                                <input type="radio" class="form-check-input" name="pago" id="visa"
                                                    value="visa" required>
                                                <label for="visa" class="form-check-label">Visa</label>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="form-check form-check-inline">
                                                <input type="radio" class="form-check-input" name="pago"
                                                    id="master-card" value="master-card" required>
                                                <label for="master-card" class="form-check-label">MC</label>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <div class="form-check form-check-inline">
                                                <input type="radio" class="form-check-input" name="pago" id="amex"
                                                    value="amex" required>
                                                <label for="amex" class="form-check-label">AMEX</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-2"></div>
                                <div class="col-md-6">
                                    <label for="comments" class="form-label">Comments</label>
                                    <textarea class="form-control" id="comments" rows="3"></textarea>
                                </div>

                            </div>
                        </form>
                    </div>
                    <div class="card-footer">
                        <div class="d-flex justify-content-end gap-2">
                            <button class="btn btn-secondary" type="reset" form="formularioPago">Cancel</button>
                            <button class="btn btn-primary" type="submit" form="formularioPago">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- form script -->
    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (() => {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll('.needs-validation')

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>

    <!-- bootstrap scrpt -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
