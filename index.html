<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Bootstrap icons -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Bootstrap Form</title>
</head>
<body>
    
<div class="container border border-secondary rounded-3 px-0">
    
    <div class="bg-light border py-3 mb-2">
        <h1 class="h2 px-4">Payment form example</h1>
    </div>

    <!-- MISSING FIELDS WARNING MESSAGE -->
    <!-- <div class="bg-danger text-danger-emphasis">
        <p>Payment form example</p>
    </div> -->

    <form class="row g-3 px-4 needs-validation" novalidate>

        <!-- CC information -->
        <div class="col-md-4 position-relative">
            <label for="cc-number" class="form-label">Card #</label>
            <input type="text" class="form-control" id="cc-number" placeholder="xxxxxxxxxxxxxxx" required>
            <div class="valid-tooltip">
            Looks good!
            </div>
        </div>
        <div class="col-md-4 position-relative">
            <label for="cvc-number" class="form-label">CVC #</label>
            <input type="text" class="form-control" id="cvc-number" placeholder="xxx" required> <!--QUE HAGO CON EL VALUE?  POR QUE NO PUEDO PONER MAX?-->
            <div class="valid-tooltip">
            Looks good!
            </div>
        </div>
        <div class="col-md-4 position-relative">
            <label for="validationTooltipUsername" class="form-label">Amount</label>
            <div class="input-group has-validation">
            <span class="input-group-text" id="validationTooltipUsernamePrepend">$</span>
            <input type="text" class="form-control" id="validationTooltipUsername" aria-describedby="validationTooltipUsernamePrepend" required>
            <div class="invalid-tooltip">
                Please choose a unique and valid username.
            </div>
            </div>
        </div>

        <!-- name lastName -->
        <div class="col-md-6 position-relative">
            <label for="name" class="form-label">First name</label>
            <input type="text" class="form-control" id="name" placeholder="Name" required>
            <div class="valid-feedback">
            Looks good!
            </div>
        </div>
        <div class="col-md-6 position-relative">
            <label for="validationCustom02" class="form-label">Last name</label>
            <input type="text" class="form-control" id="validationCustom02" placeholder="Last Name" required>
            <div class="valid-feedback">
                Looks good!
            </div>
        </div>
        
        <!-- city state postal code -->
        <div class="col-md-6">
            <label for="validationCustom03" class="form-label">City</label>
            <input type="text" class="form-control" id="validationCustom03" required>
            <div class="invalid-feedback">
            Please provide a valid city.
            </div>
        </div>
        <div class="col-md-3">
            <label for="validationCustom04" class="form-label">State</label>
            <select class="form-select" id="validationCustom04" required>
            <option selected disabled value="">Choose...</option>
            <option>...</option>
            </select>
            <div class="invalid-feedback">
            Please select a valid state.
            </div>
        </div>
        <div class="col-md-3">
            <label for="validationCustom05" class="form-label">Zip</label>
            <input type="text" class="form-control" id="validationCustom05" required>
            <div class="invalid-feedback">
            Please provide a valid zip.
            </div>
        </div>

        <!-- payment info and comments -->
        <div class="col-md-6"><!-- HAY MEJOR MANERA DE DIVIDIR ESTOS ESPACIOS Y SU CHILD?  -->
            <label class="form-label">We accept</label>
            <div class="row p-2">
                <ul class="list-group list-group-horizontal">
                    <li class="list-group-item bg-secondary">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radio-explorer" required>
                            <label class="form-check-label" for="radio-explorer">
                                <i class="bi bi-badge-vo"></i>
                            </label>
                        </div>                      
                    </li>
                    <li class="list-group-item bg-secondary">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radio-visa" required>
                            <label class="form-check-label" for="radio-visa">
                                <i class="bi bi-badge-cc"></i>
                            </label>
                        </div>      
                    </li>
                    <li class="list-group-item bg-secondary">
                        <div class="form-check">                      
                            <input class="form-check-input" type="radio" id="radio-masterCard" name="radioDefault"  required>
                            <label class="form-check-label" for="radio-masterCard">
                                <i class="bi bi-credit-card"></i>
                            </label>
                        </div>
                    </li>
                </ul>
            </div>
        </div>    
                
        <div class="col-md-6">
            <label for="comments" class="form-label">Comments</label>
            <textarea class="form-control" id="comments" rows="3"></textarea>
        </div>

        <div class="col-12 py-3 bg-light">
            <button class="btn btn-secondary" type="submit">Cancel</button>
            <button class="btn btn-primary" type="submit">Send</button>
        </div>

    </form>
</div>


<!-- form script -->
 <script>
    // Example starter JavaScript for disabling form submissions if there are invalid fields
(() => {
  'use strict'

  // Fetch all the forms we want to apply custom Bootstrap validation styles to
  const forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }

      form.classList.add('was-validated')
    }, false)
  })
})()
 </script>

<!-- bootstrap scrpt -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
